name: Daily English Word Generator

on:
  schedule:
    # UTC 15:00 = 한국 시간(KST) 매일 자정 00:00
    - cron: '0 15 * * *'
    # 자동복구: KST 06:00
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: english_audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai pydantic edge-tts

      - name: Run generator script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_word.py

      - name: Commit and push updated JSON and Audio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/daily_words.json audio/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily word and native audio" && git push)
