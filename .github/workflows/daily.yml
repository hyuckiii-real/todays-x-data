name: Daily Word Generator

on:
  schedule:
    # 한국 시간(KST) 매일 00시 18분에 자동 실행 (정각 트래픽 회피)
    - cron: '18 15 * * *'
  workflow_dispatch:

jobs:
  run-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: requests 설치
        run: pip install requests

      - name: 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py

      - name: 갱신된 파일 커밋 및 푸시
        run: |
          git config --global user.name "DailyBot"
          git config --global user.email "bot@github.com"
          git add today.json archive.json
          git commit -m "Auto update: $(date +'%Y-%m-%d')" || exit 0
          git push
